# Local development database. Port 55432 on the host so it doesn't clash
# with native PostgreSQL installs (this PC already has them on 5432 and 5433).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: una
      POSTGRES_PASSWORD: una_dev_password
      POSTGRES_DB: una_mart
    ports:
      - "55432:5432"
    volumes:
      - una_mart_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U una -d una_mart"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  una_mart_pg:
